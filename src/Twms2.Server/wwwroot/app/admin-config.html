<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEXA 설정 — TWMS</title>
  <!-- 테마 선적용 (FOUC 방지) -->
  <script>(function(){try{var t=localStorage.getItem('twms-theme');if(t==='dark')document.documentElement.classList.add('dark');else if(t==='light')document.documentElement.classList.remove('dark');}catch(e){}})();</script>
  <!-- 폰트: Inter(라틴) + Noto Sans KR(한글) + Material Symbols -->
  <link rel="stylesheet" href="/lib/fonts/fonts.css" />
  <!-- Tailwind: 빌드타임 컴파일(twms.css) + 폰트 self-host(fonts.css). CDN 제거됨. -->
  <link rel="stylesheet" href="/app/twms.css" />
  <link rel="stylesheet" href="/app/theme.css" />
  <style>
    /* ── DEXA 설정(관리) 페이지 전용 (theme.css 미수록 컨트롤) ── */
    /* 액션 버튼 (history.html 의 .hist-btn 톤 재사용) */
    .ac-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 12px; cursor: pointer;
      font-size: 13px; font-weight: 700; border: none;
      background: var(--c-surface); color: var(--c-on-surface-variant);
      box-shadow: 4px 4px 8px var(--nm-dark), -4px -4px 8px var(--nm-light);
      transition: all 0.15s ease;
    }
    .ac-btn:hover:not(:disabled) { color: var(--c-primary); }
    .ac-btn:active:not(:disabled) { box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light); }
    .ac-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .ac-btn .material-symbols-outlined { font-size: 18px; }
    .ac-btn-primary { color: var(--c-primary); }
    .ac-btn-warning:hover:not(:disabled) { color: var(--health-inprogress); }
    .ac-btn-danger:hover:not(:disabled) { color: var(--health-failed); }

    /* 아이콘 버튼 (작업 열) */
    .ac-iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 8px; cursor: pointer; border: none;
      background: var(--c-surface); color: var(--c-on-surface-variant);
      box-shadow: 2px 2px 5px var(--nm-dark), -2px -2px 5px var(--nm-light);
      transition: all 0.15s ease; text-decoration: none;
    }
    .ac-iconbtn:hover:not(:disabled) { color: var(--c-primary); }
    .ac-iconbtn:active:not(:disabled) { box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light); }
    .ac-iconbtn:disabled { opacity: 0.45; cursor: not-allowed; }
    .ac-iconbtn .material-symbols-outlined { font-size: 18px; }
    .ac-iconbtn-success:hover:not(:disabled) { color: var(--health-backedup); }
    .ac-iconbtn-info:hover:not(:disabled) { color: var(--c-primary); }
    .ac-iconbtn-danger:hover:not(:disabled) { color: var(--health-failed); }

    /* 상태 칩 버튼 (활성/비활성 토글) — 표면색 + 상태색 점·글자 */
    .ac-chip-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 8px; cursor: pointer; border: none;
      background: var(--c-surface); font: inherit; font-size: 11px; font-weight: 700;
      box-shadow: 2px 2px 5px var(--nm-dark), -2px -2px 5px var(--nm-light);
      transition: all 0.15s ease;
    }
    .ac-chip-btn::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
    .ac-chip-btn:hover { transform: translateY(-1px); }
    .ac-chip-btn:active { transform: none; box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light); }
    .ac-chip-btn-on { color: var(--health-backedup); }
    .ac-chip-btn-off { color: var(--c-on-surface-variant); }

    /* 인셋 입력 (history .hist-input 톤) */
    .ac-input {
      background: var(--c-surface); color: var(--c-on-surface);
      border: none; outline: none; border-radius: 10px;
      padding: 8px 12px; font-size: 13px; font-family: inherit; width: 100%;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
    }
    .ac-input::placeholder { color: var(--c-outline); }
    select.ac-input { cursor: pointer; }

    /* cron 표현식 링크 (스케줄 셀) */
    .ac-cron-link {
      color: var(--c-primary); font-weight: 700; cursor: pointer;
      text-decoration: none; border-bottom: 1px dashed transparent;
    }
    .ac-cron-link:hover { border-bottom-color: var(--c-primary); }

    .ac-checkbox { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--c-on-surface-variant); cursor: pointer; user-select: none; }
    .ac-checkbox input { width: 16px; height: 16px; accent-color: var(--c-primary); cursor: pointer; }

    .ac-table-wrap {
      border-radius: 16px; padding: 6px 12px; overflow-x: auto;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
      background: var(--c-surface-container-low);
    }
    .ac-table-wrap .nm-table td { white-space: nowrap; }
    .ac-table-wrap .nm-table td.wrap { white-space: normal; max-width: 260px; }
    .ac-empty { padding: 18px; color: var(--c-on-surface-variant); font-size: 14px; }
    .ac-loading { padding: 18px; color: var(--c-on-surface-variant); font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .ac-actions { display: inline-flex; gap: 6px; align-items: center; }

    /* 인라인 스피너 */
    .ac-spinner {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--c-outline-variant); border-top-color: var(--health-inprogress);
      animation: ac-spin 0.8s linear infinite; display: inline-block;
    }
    @keyframes ac-spin { to { transform: rotate(360deg); } }

    /* 모달 (트리거 추가 / cron 수정) */
    .ac-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.35);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .ac-modal-backdrop.open { display: flex; }
    .ac-modal {
      background: var(--c-surface); border-radius: 24px; padding: 28px;
      width: 100%; max-width: 460px; margin: 16px;
      box-shadow: 8px 8px 18px var(--nm-dark), -8px -8px 18px var(--nm-light);
    }
    .ac-modal h3 { font-weight: 800; font-size: 1.1rem; color: var(--c-on-surface); margin: 0 0 18px; }
    .ac-field { margin-bottom: 14px; }
    .ac-field label { display: block; font-size: 12px; font-weight: 700; color: var(--c-on-surface-variant); margin-bottom: 6px; }
    .ac-field .ac-hint { font-size: 11px; color: var(--c-outline); margin-top: 4px; }
    .ac-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
    .ac-deviation {
      display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px;
      border-radius: 12px; font-size: 12px; color: var(--c-on-surface-variant);
      background: var(--c-surface-container-low);
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
      margin-top: 10px;
    }
    .ac-deviation .material-symbols-outlined { font-size: 18px; color: var(--health-inprogress); flex-shrink: 0; }

    /* 자산 매핑 모달 (ScheduleAssetEditor 이식) */
    .ac-map-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .ac-map-list { max-height: 50vh; overflow-y: auto; padding-right: 4px; }
    .ac-map-group {
      padding: 8px 12px; border-radius: 12px; margin-bottom: 8px;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
    }
    .ac-map-grouphead {
      display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--c-on-surface);
      cursor: pointer; padding-bottom: 6px; border-bottom: 1px solid var(--c-outline-variant); margin-bottom: 4px;
    }
    .ac-map-grouphead input, .ac-map-asset input { width: 16px; height: 16px; accent-color: var(--c-primary); cursor: pointer; flex-shrink: 0; }
    .ac-map-gcount { color: var(--c-on-surface-variant); font-size: 12px; }
    .ac-map-asset { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--c-on-surface); padding: 3px 0 3px 22px; cursor: pointer; }
    .ac-map-ico { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; }
    .ac-map-ip { color: var(--c-on-surface-variant); font-size: 12px; margin-left: 4px; }

    /* 스케줄 빌더 (cron 대신 쉬운 주기 선택 UI) */
    .ac-seg { display: flex; gap: 8px; flex-wrap: wrap; }
    .ac-seg-btn, .ac-dow-btn { border: none; cursor: pointer; font-size: 13px; font-weight: 700; font-family: inherit; background: var(--c-surface); color: var(--c-on-surface-variant); box-shadow: 3px 3px 6px var(--nm-dark), -3px -3px 6px var(--nm-light); transition: all 0.15s ease; }
    .ac-seg-btn { padding: 7px 13px; border-radius: 10px; }
    .ac-dow-btn { width: 36px; height: 32px; border-radius: 10px; }
    .ac-seg-btn:hover, .ac-dow-btn:hover { color: var(--c-primary); }
    .ac-seg-btn.on, .ac-dow-btn.on { color: var(--c-primary); box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light); }
    .ac-dow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
    .ac-sched-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--c-on-surface-variant); flex-wrap: wrap; }
    .ac-sched-row .ac-input { width: auto; }
    .ac-sched-preview { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 14px; border-radius: 12px; font-size: 13px; background: var(--c-surface-container-low); box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light); }
    .ac-sched-preview .material-symbols-outlined { font-size: 20px; color: var(--c-primary); flex-shrink: 0; }
    .ac-sched-preview b { color: var(--c-on-surface); }
    .ac-sched-preview code { display: block; font-size: 11px; color: var(--c-outline); margin-top: 2px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .ac-sched-preview.err .material-symbols-outlined, .ac-sched-preview.err b { color: var(--health-failed); }
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
</head>
<body class="font-body-md">
  <!-- 페이지 본문: shell.js 가 이 .dsp-page 를 사이드바+헤더와 함께 main 안으로 이동시킨다 -->
  <div class="dsp-page">
    <div class="flex justify-between items-end mb-element-gap">
      <div>
        <h2 class="font-headline-lg text-headline-lg text-primary" style="margin:0;">DEXA 설정</h2>
        <p class="text-on-surface-variant" style="margin:4px 0 0;">에이전트 · 백업 트리거 관리</p>
      </div>
    </div>

    <!-- ─── 에이전트 목록 ─── -->
    <div class="nm-card mb-element-gap">
      <div class="panel-header">
        <span class="panel-title">에이전트 목록</span>
        <div style="display:flex;align-items:center;gap:14px;">
          <label class="ac-checkbox"><input type="checkbox" id="show-offline" />오프라인 에이전트도 보기</label>
          <button class="ac-btn" id="agents-refresh"><span class="material-symbols-outlined">refresh</span>새로고침</button>
        </div>
      </div>
      <div id="agents-host">
        <div class="ac-loading"><span class="ac-spinner"></span>불러오는 중…</div>
      </div>
    </div>

    <!-- ─── 스케줄 설정 (트리거 목록) ─── -->
    <div class="nm-card" style="margin-bottom:24px;">
      <div class="panel-header">
        <span class="panel-title">스케줄 설정</span>
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="ac-btn ac-btn-primary" id="trigger-add"><span class="material-symbols-outlined">add</span>트리거 추가</button>
          <button class="ac-btn" id="triggers-refresh"><span class="material-symbols-outlined">refresh</span>새로고침</button>
        </div>
      </div>
      <div id="triggers-host">
        <div class="ac-loading"><span class="ac-spinner"></span>불러오는 중…</div>
      </div>
    </div>

    <!-- ─── 수동 백업 테스트 (선택 자산 순차 실행) ─── -->
    <div class="nm-card" style="margin-bottom:24px;">
      <div class="panel-header">
        <span class="panel-title">수동 백업 테스트</span>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="chip chip-info" id="bt-selcount">0개 선택</span>
          <button class="ac-btn ac-btn-primary" id="bt-run"><span class="material-symbols-outlined">play_arrow</span>선택 자산 순차 백업</button>
          <button class="ac-btn ac-btn-danger" id="bt-stop" style="display:none;"><span class="material-symbols-outlined">stop</span>중지</button>
          <button class="ac-btn" id="bt-refresh"><span class="material-symbols-outlined">refresh</span>새로고침</button>
        </div>
      </div>
      <div class="ac-deviation" style="margin:0 0 12px;">
        <span class="material-symbols-outlined">info</span>
        <span>선택한 자산을 위에서부터 <b>한 대씩 순서대로</b> 백업하고 결과를 표시합니다. 진행 중 페이지를 벗어나면 남은 자산은 실행되지 않으며, 이미 시작된 백업은 서버에서 계속 진행됩니다.</span>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
        <input type="text" class="ac-input" id="bt-search" placeholder="이름·IP 검색" style="max-width:220px;" />
        <select class="ac-input" id="bt-line" style="max-width:180px;"><option value="">전체 라인</option></select>
        <select class="ac-input" id="bt-type" style="max-width:180px;"><option value="">전체 타입</option></select>
        <select class="ac-input" id="bt-health" style="max-width:180px;">
          <option value="">전체 상태</option>
          <option value="failed">작업 실패</option>
          <option value="backedup">백업 갱신</option>
          <option value="unchanged">변경 없음</option>
          <option value="inprogress">작업중</option>
          <option value="unknown">내역 없음</option>
        </select>
      </div>
      <div id="bt-host">
        <div class="ac-loading"><span class="ac-spinner"></span>불러오는 중…</div>
      </div>
    </div>
  </div>

  <!-- ─── 모달: 트리거 추가 ─── -->
  <div class="ac-modal-backdrop" id="add-modal">
    <div class="ac-modal">
      <h3>트리거 추가</h3>
      <div class="ac-field">
        <label for="add-name">이름</label>
        <input type="text" class="ac-input" id="add-name" placeholder="예: 야간 정기 백업" />
      </div>
      <div class="ac-field">
        <label>실행 주기</label>
        <div id="add-sched"></div>
      </div>
      <div class="ac-field">
        <label for="add-desc">설명 (선택)</label>
        <input type="text" class="ac-input" id="add-desc" placeholder="설명" />
      </div>
      <div class="ac-modal-actions">
        <button class="ac-btn" data-close="add-modal">취소</button>
        <button class="ac-btn ac-btn-primary" id="add-save"><span class="material-symbols-outlined">save</span>추가</button>
      </div>
    </div>
  </div>

  <!-- ─── 모달: 스케줄(cron) 수정 ─── -->
  <div class="ac-modal-backdrop" id="cron-modal">
    <div class="ac-modal">
      <h3>스케줄 수정</h3>
      <div class="ac-field">
        <label id="cron-trigger-label">트리거</label>
        <div id="cron-sched"></div>
      </div>
      <div class="ac-modal-actions">
        <button class="ac-btn" data-close="cron-modal">취소</button>
        <button class="ac-btn ac-btn-primary" id="cron-save"><span class="material-symbols-outlined">save</span>저장</button>
      </div>
    </div>
  </div>

  <!-- ─── 모달: 트리거 ↔ 자산 매핑 ─── -->
  <div class="ac-modal-backdrop" id="map-modal">
    <div class="ac-modal" style="max-width:640px;">
      <h3 id="map-title">자산 매핑</h3>
      <div class="ac-map-toolbar">
        <span class="chip chip-info" id="map-count">0개 선택</span>
        <div style="flex:1 1 auto;"></div>
        <button class="ac-btn" id="map-all"><span class="material-symbols-outlined">done_all</span>전체 선택</button>
        <button class="ac-btn" id="map-none"><span class="material-symbols-outlined">remove_done</span>전체 해제</button>
      </div>
      <div class="ac-map-list" id="map-list">
        <div class="ac-loading"><span class="ac-spinner"></span>불러오는 중…</div>
      </div>
      <div class="ac-modal-actions">
        <button class="ac-btn" data-close="map-modal">취소</button>
        <button class="ac-btn ac-btn-primary" id="map-save"><span class="material-symbols-outlined">save</span>저장</button>
      </div>
    </div>
  </div>

  <script src="/app/shell.js"></script>
  <script src="/app/admin-config.js"></script>
</body>
</html>
