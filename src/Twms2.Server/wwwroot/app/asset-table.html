<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자산 테이블 편집 — TWMS</title>
  <!-- 테마 선적용 (FOUC 방지) -->
  <script>(function(){try{var t=localStorage.getItem('twms-theme');if(t==='dark')document.documentElement.classList.add('dark');else if(t==='light')document.documentElement.classList.remove('dark');}catch(e){}})();</script>
  <!-- 폰트: Pretendard(한글) + Hanken Grotesk + JetBrains Mono + Material Symbols -->
  <link rel="stylesheet" href="/lib/fonts/fonts.css" />
  <!-- Tailwind: 빌드타임 컴파일(twms.css) + 폰트 self-host(fonts.css). CDN 제거됨. -->
  <link rel="stylesheet" href="/app/twms.css" />
  <link rel="stylesheet" href="/app/theme.css" />
  <style>
    /* ── 자산 테이블 편집 페이지 전용 (history.html 와 동일 톤) ── */
    /* 탭 바 */
    .hist-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .hist-tab {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 14px; cursor: pointer;
      font-weight: 700; font-size: 14px; color: var(--c-on-surface-variant);
      background: var(--c-surface); border: none;
      box-shadow: 4px 4px 8px var(--nm-dark), -4px -4px 8px var(--nm-light);
      transition: all 0.2s ease;
    }
    .hist-tab:hover { color: var(--c-primary); }
    .hist-tab.active {
      color: var(--c-primary);
      box-shadow: inset 4px 4px 8px var(--nm-dark), inset -4px -4px 8px var(--nm-light);
    }
    .hist-tab .material-symbols-outlined { font-size: 20px; }
    .hist-tab img { width: 18px; height: 18px; object-fit: contain; }
    .hist-tab .tab-mod {
      width: 7px; height: 7px; border-radius: 50%; background: var(--health-inprogress);
      display: inline-block; margin-left: 2px;
    }

    /* 필터/액션 바 */
    .hist-filter { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .hist-divider { width: 1px; height: 24px; background: var(--c-outline-variant); opacity: 0.5; margin: 0 2px; }
    .hist-spacer { flex: 1 1 auto; }

    .hist-input {
      background: var(--c-surface); color: var(--c-on-surface);
      border: none; outline: none; border-radius: 10px;
      padding: 8px 12px; font-size: 13px; font-family: inherit;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
    }
    .hist-input::placeholder { color: var(--c-outline); }
    select.hist-input { cursor: pointer; }
    .hist-search { display: inline-flex; align-items: center; gap: 8px; padding-left: 12px; }
    .hist-search .material-symbols-outlined { color: var(--c-outline); font-size: 20px; }
    .hist-search input { background: transparent; border: none; outline: none; color: var(--c-on-surface); font-size: 13px; width: 200px; }

    /* 액션 버튼 */
    .hist-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 12px; cursor: pointer;
      font-size: 13px; font-weight: 700; border: none;
      background: var(--c-surface); color: var(--c-on-surface-variant);
      box-shadow: 4px 4px 8px var(--nm-dark), -4px -4px 8px var(--nm-light);
      transition: all 0.15s ease;
    }
    .hist-btn:hover:not(:disabled) { color: var(--c-primary); }
    .hist-btn:active:not(:disabled) { box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light); }
    .hist-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .hist-btn .material-symbols-outlined { font-size: 18px; }
    .hist-btn-primary { color: var(--c-primary); }
    .hist-btn-primary:hover:not(:disabled) { color: var(--c-primary); }
    .hist-btn-success:hover:not(:disabled) { color: var(--health-backedup); }

    .hist-count { font-size: 13px; color: var(--c-on-surface-variant); margin-bottom: 10px; font-weight: 600; }

    /* 테이블 컨테이너 */
    .hist-table-wrap {
      border-radius: 16px; padding: 6px 12px; overflow: auto; max-height: calc(100vh - 360px);
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
      background: var(--c-surface-container-low);
    }
    .hist-table-wrap .nm-table th {
      white-space: nowrap; cursor: pointer; user-select: none;
      position: sticky; top: 0; z-index: 2;
      background: var(--c-surface-container-low);
    }
    .hist-table-wrap .nm-table th .sort-arrow { font-size: 12px; opacity: 0.6; }
    .hist-table-wrap .nm-table td { white-space: nowrap; vertical-align: middle; }

    /* 편집 셀 입력 (인셋 미니) */
    .edit-in {
      background: transparent; color: var(--c-on-surface);
      border: 1px solid transparent; border-radius: 7px; outline: none;
      padding: 4px 6px; font-size: 12px; font-family: inherit; width: 100%;
      min-width: 70px; transition: border-color 0.12s, background 0.12s;
    }
    .edit-in:hover { border-color: var(--c-outline-variant); }
    .edit-in:focus { border-color: var(--c-primary); background: var(--c-surface); }
    .edit-in.num { min-width: 56px; text-align: right; }
    select.edit-in { cursor: pointer; min-width: 96px; }
    .edit-in::placeholder { color: var(--c-outline); }

    /* 수정된 행 강조 */
    .nm-table tr.row-mod td { background: rgba(255, 193, 7, 0.12); }
    .dark .nm-table tr.row-mod td { background: rgba(255, 193, 7, 0.08); }

    /* 비해당 셀 */
    .cell-na { display: block; text-align: center; opacity: 0.3; user-select: none; }
    td.cell-na-bg { background: rgba(0, 0, 0, 0.05); }
    .dark td.cell-na-bg { background: rgba(255, 255, 255, 0.04); }

    /* ID/체크 셀 */
    .nm-table td.col-id, .nm-table th.col-id { width: 44px; color: var(--c-on-surface-variant); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    .nm-table td.col-sel, .nm-table th.col-sel { width: 34px; text-align: center; cursor: default; }
    .nm-table td.col-type, .nm-table th.col-type { width: 84px; }
    .type-cell { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; }
    .type-cell img { width: 16px; height: 16px; object-fit: contain; }

    .robot-check { width: 16px; height: 16px; cursor: pointer; accent-color: var(--c-primary); }

    /* 페이저 */
    .hist-pager { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--c-on-surface-variant); }
    .hist-iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 8px; cursor: pointer; border: none;
      background: var(--c-surface); color: var(--c-on-surface-variant);
      box-shadow: 2px 2px 5px var(--nm-dark), -2px -2px 5px var(--nm-light);
      transition: all 0.15s ease; text-decoration: none;
    }
    .hist-iconbtn:hover:not(:disabled) { color: var(--c-primary); }
    .hist-iconbtn:disabled { opacity: 0.4; cursor: not-allowed; }
    .hist-iconbtn:active:not(:disabled) { box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light); }
    .hist-iconbtn .material-symbols-outlined { font-size: 18px; }
    .hist-empty { padding: 20px; color: var(--c-on-surface-variant); font-size: 14px; }
    .hist-tabpanel { display: none; }
    .hist-tabpanel.active { display: block; }

    /* 진행/결과 알림 */
    .hist-alert {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 12px; margin-bottom: 14px; font-size: 13px; font-weight: 600;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
    }
    .hist-alert .material-symbols-outlined { font-size: 20px; }
    .hist-alert.ok { color: var(--health-backedup); }
    .hist-alert.warn { color: var(--health-inprogress); }
    .hist-alert.err { color: var(--health-failed); }
    .hist-alert.info { color: var(--c-primary); }
    .hist-alert .close { margin-left: auto; cursor: pointer; opacity: 0.6; }
    .hist-alert .close:hover { opacity: 1; }
    .hist-progress { height: 8px; border-radius: 9999px; background: var(--c-surface-container-low); overflow: hidden; margin-bottom: 12px;
      box-shadow: inset 2px 2px 4px var(--nm-dark), inset -2px -2px 4px var(--nm-light); }
    .hist-progress > div { height: 100%; background: var(--c-primary); border-radius: 9999px; transition: width 0.2s; }

    /* 배치 편집 패널 (슬라이드 인) */
    .batch-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 60; display: none; }
    .batch-overlay.open { display: block; }
    .batch-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 92vw; z-index: 61;
      background: var(--c-surface); transform: translateX(100%); transition: transform 0.25s ease;
      display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,0.25);
    }
    .batch-panel.open { transform: translateX(0); }
    .batch-head { display: flex; align-items: center; gap: 8px; padding: 18px 20px; border-bottom: 1px solid var(--c-outline-variant); }
    .batch-head .panel-title { font-size: 16px; }
    .batch-head .close { margin-left: auto; cursor: pointer; color: var(--c-on-surface-variant); }
    .batch-body { padding: 18px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
    .batch-foot { padding: 14px 20px; border-top: 1px solid var(--c-outline-variant); display: flex; gap: 10px; justify-content: flex-end; }
    .batch-field { display: flex; align-items: center; gap: 10px; }
    .batch-field input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--c-primary); cursor: pointer; flex: 0 0 auto; }
    .batch-field .bf-input { flex: 1; }
    .batch-section { font-size: 12px; font-weight: 700; color: var(--c-on-surface-variant); margin-top: 4px; }
    .batch-note { font-size: 12px; color: var(--c-on-surface-variant); line-height: 1.5; }
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
</head>
<body class="font-body-md">
  <!-- 페이지 본문: shell.js 가 이 .dsp-page 를 사이드바+헤더와 함께 main 안으로 이동시킨다 -->
  <div class="dsp-page">
    <div class="flex justify-between items-end mb-element-gap">
      <div>
        <h2 class="font-headline-lg text-headline-lg text-primary" style="margin:0;">자산 테이블 편집</h2>
        <p class="text-on-surface-variant" style="margin:4px 0 0;">자산 정보를 표에서 직접 편집 · 일괄 저장</p>
      </div>
      <div class="hist-filter" style="margin:0;">
        <span class="hist-count" id="t-summary" style="margin:0;"></span>
        <button class="hist-btn" id="t-batch"><span class="material-symbols-outlined">edit_note</span>일괄 편집</button>
        <button class="hist-btn" id="t-csv"><span class="material-symbols-outlined">file_download</span>CSV 내보내기</button>
        <button class="hist-btn" id="t-refresh"><span class="material-symbols-outlined">refresh</span>새로고침</button>
        <button class="hist-btn hist-btn-primary" id="t-save"><span class="material-symbols-outlined">save</span>저장</button>
      </div>
    </div>

    <!-- 진행/결과 알림 -->
    <div class="hist-progress" id="t-progress" style="display:none;"><div style="width:0%"></div></div>
    <div class="hist-alert info" id="t-alert" style="display:none;">
      <span class="material-symbols-outlined" id="t-alert-icon">info</span>
      <span id="t-alert-msg"></span>
      <span class="material-symbols-outlined close" id="t-alert-close">close</span>
    </div>

    <!-- 탭 (전체 + 유형별) -->
    <div class="hist-tabs" id="t-tabs"></div>

    <!-- 테이블 -->
    <div class="hist-tabpanel active" data-panel="grid">
      <div class="nm-card">
        <div class="hist-filter">
          <div class="nm-inset hist-search" style="border-radius:10px;">
            <span class="material-symbols-outlined">search</span>
            <input type="text" id="t-search" placeholder="자산명 / IP / 벤더 / 사양 검색" />
          </div>
          <div class="hist-spacer"></div>
        </div>
        <div class="hist-count" id="t-count"></div>
        <div class="hist-table-wrap"><table class="nm-table" id="t-table"></table></div>
        <div class="hist-pager" id="t-pager"></div>
      </div>
    </div>
  </div>

  <!-- 배치 편집 패널 (AssetBatchEditDialog 이식) -->
  <div class="batch-overlay" id="batch-overlay"></div>
  <aside class="batch-panel" id="batch-panel">
    <div class="batch-head">
      <span class="material-symbols-outlined" style="color:var(--c-primary);">edit_note</span>
      <span class="panel-title">일괄 편집</span>
      <span class="material-symbols-outlined close" id="batch-close">close</span>
    </div>
    <div class="batch-body">
      <p class="batch-note" id="batch-note"></p>

      <label class="batch-field"><input type="checkbox" id="b-apply-agent" />
        <input class="hist-input bf-input" id="b-agent" placeholder="에이전트 선호도 (Agent1;Agent2)" disabled /></label>
      <label class="batch-field"><input type="checkbox" id="b-apply-name" />
        <input class="hist-input bf-input" id="b-name" placeholder="자산명" disabled /></label>
      <label class="batch-field"><input type="checkbox" id="b-apply-ip" />
        <input class="hist-input bf-input" id="b-ip" placeholder="IP 주소" disabled /></label>
      <label class="batch-field"><input type="checkbox" id="b-apply-desc" />
        <input class="hist-input bf-input" id="b-desc" placeholder="설명" disabled /></label>

      <div class="batch-section">PLC/서보 핑 테스트 설정</div>
      <label class="batch-field"><input type="checkbox" id="b-apply-via" />
        <input class="hist-input bf-input" id="b-via" placeholder="경유 IP (비우면 클리어)" disabled /></label>
      <label class="batch-field"><input type="checkbox" id="b-apply-base" />
        <input class="hist-input bf-input num" id="b-base" type="number" min="0" placeholder="Base 번호" disabled /></label>
      <label class="batch-field"><input type="checkbox" id="b-apply-slot" />
        <input class="hist-input bf-input num" id="b-slot" type="number" min="0" placeholder="Slot 번호" disabled /></label>
    </div>
    <div class="batch-foot">
      <button class="hist-btn" id="batch-cancel">취소</button>
      <button class="hist-btn hist-btn-primary" id="batch-apply"><span class="material-symbols-outlined">done_all</span>적용</button>
    </div>
  </aside>

  <script src="/app/shell.js"></script>
  <script src="/app/asset-table.js"></script>
</body>
</html>
