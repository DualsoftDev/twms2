<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리 — TWMS</title>
  <!-- 테마 선적용 (FOUC 방지) -->
  <script>(function(){try{var t=localStorage.getItem('twms-theme');if(t==='dark')document.documentElement.classList.add('dark');else if(t==='light')document.documentElement.classList.remove('dark');}catch(e){}})();</script>
  <!-- 폰트: Inter(라틴) + Noto Sans KR(한글) + Material Symbols -->
  <link rel="stylesheet" href="/lib/fonts/fonts.css" />
  <!-- Tailwind: 빌드타임 컴파일(twms.css) + 폰트 self-host(fonts.css). CDN 제거됨. -->
  <link rel="stylesheet" href="/app/twms.css" />
  <link rel="stylesheet" href="/app/theme.css" />
  <style>
    /* 관리 허브 네비 카드 (AdminIndex.razor admin-tile 의 뉴모피즘 재해석) */
    .admin-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .admin-tile {
      background: var(--c-surface); border-radius: 24px; padding: 24px;
      box-shadow: 6px 6px 12px var(--nm-dark), -6px -6px 12px var(--nm-light);
      display: flex; flex-direction: column; gap: 6px; text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .admin-tile:hover { transform: translateY(-3px); box-shadow: 8px 8px 16px var(--nm-dark), -8px -8px 16px var(--nm-light); }
    .admin-tile:active { box-shadow: inset 4px 4px 8px var(--nm-dark), inset -4px -4px 8px var(--nm-light); transform: scale(0.99); }
    .admin-tile-icon {
      width: 56px; height: 56px; border-radius: 16px; margin-bottom: 8px;
      display: flex; align-items: center; justify-content: center; color: var(--c-primary);
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
    }
    .admin-tile-icon .material-symbols-outlined { font-size: 30px; }
    .admin-tile-label { font-weight: 800; font-size: 1.05rem; color: var(--c-on-surface); }
    .admin-tile-desc { font-size: 13px; color: var(--c-on-surface-variant); }
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
</head>
<body class="font-body-md">
  <!-- 페이지 본문: shell.js 가 이 .dsp-page 를 사이드바+헤더와 함께 main 안으로 이동시킨다 -->
  <div class="dsp-page">
    <div class="flex justify-between items-end mb-element-gap">
      <div>
        <h2 class="font-headline-lg text-headline-lg text-primary" style="margin:0;">관리</h2>
        <p class="text-on-surface-variant" style="margin:4px 0 0;">시스템 구성 · 자산 · 레이아웃 관리</p>
      </div>
    </div>

    <!-- 관리 허브 네비 카드 (각 링크는 기존 Blazor 페이지로 이동) -->
    <div class="admin-grid">
      <a href="/assets/table" class="admin-tile">
        <span class="admin-tile-icon"><span class="material-symbols-outlined">table_chart</span></span>
        <span class="admin-tile-label">자산 테이블 편집</span>
        <span class="admin-tile-desc">자산 데이터 편집 및 관리</span>
      </a>

      <a href="/admin/layout" class="admin-tile">
        <span class="admin-tile-icon"><span class="material-symbols-outlined">map</span></span>
        <span class="admin-tile-label">레이아웃 관리</span>
        <span class="admin-tile-desc">도면 편집 및 자산 배치 관리</span>
      </a>

      <a href="/settings" class="admin-tile">
        <span class="admin-tile-icon"><span class="material-symbols-outlined">settings</span></span>
        <span class="admin-tile-label">종합설비관리 설정</span>
        <span class="admin-tile-desc">백업 및 설비관리 정책 설정</span>
      </a>

      <a href="/admin/config" class="admin-tile">
        <span class="admin-tile-icon"><span class="material-symbols-outlined">tune</span></span>
        <span class="admin-tile-label">DEXA 설정</span>
        <span class="admin-tile-desc">에이전트, 스케줄 및 서버 구성</span>
      </a>

      <a href="/admin/database" class="admin-tile">
        <span class="admin-tile-icon"><span class="material-symbols-outlined">storage</span></span>
        <span class="admin-tile-label">DB 관리</span>
        <span class="admin-tile-desc">데이터베이스 관리 및 마이그레이션</span>
      </a>
    </div>
  </div>

  <script src="/app/shell.js"></script>
  <script src="/app/admin.js"></script>
</body>
</html>
