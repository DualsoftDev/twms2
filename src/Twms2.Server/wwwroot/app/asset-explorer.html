<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자산 관리 — TWMS</title>
  <!-- 테마 선적용 (FOUC 방지) -->
  <script>(function(){try{var t=localStorage.getItem('twms-theme');if(t==='dark')document.documentElement.classList.add('dark');else if(t==='light')document.documentElement.classList.remove('dark');}catch(e){}})();</script>
  <!-- 폰트: Pretendard(한글) + Hanken Grotesk + JetBrains Mono + Material Symbols -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <!-- ⚠ Tailwind Play CDN (개발/검증용). 운영 전 self-host 컴파일로 교체. -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/app/tailwind-config.js"></script>
  <link rel="stylesheet" href="/app/theme.css" />
  <style>
    /* ── 자산 관리 랜딩 페이지 전용 ── */
    .ax-filter { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .ax-divider { width: 1px; height: 24px; background: var(--c-outline-variant); opacity: 0.5; margin: 0 2px; }
    .ax-spacer { flex: 1 1 auto; }
    .ax-search { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; }
    .ax-search .material-symbols-outlined { color: var(--c-outline); font-size: 20px; }
    .ax-search input { background: transparent; border: none; outline: none; color: var(--c-on-surface); font-size: 13px; width: 200px; }
    .ax-input {
      background: var(--c-surface); color: var(--c-on-surface);
      border: none; outline: none; border-radius: 10px;
      padding: 8px 12px; font-size: 13px; font-family: inherit; cursor: pointer;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
    }
    .ax-count { font-size: 13px; color: var(--c-on-surface-variant); margin-bottom: 12px; font-weight: 600; }

    /* 자산 카드 그리드 (AssetStatusCard 형태 유지) */
    .ax-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .ax-asset-card {
      display: block; text-decoration: none; padding: 14px 16px; border-radius: 18px;
      background: var(--c-surface); border-left: 4px solid var(--health-unknown);
      box-shadow: 5px 5px 10px var(--nm-dark), -5px -5px 10px var(--nm-light);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .ax-asset-card:hover { transform: translateY(-2px); }
    .ax-asset-card.border-backedup { border-left-color: var(--health-backedup); }
    .ax-asset-card.border-unchanged { border-left-color: var(--health-unchanged); }
    .ax-asset-card.border-failed { border-left-color: var(--health-failed); }
    .ax-asset-card.border-inprogress { border-left-color: var(--health-inprogress); }
    .ax-card-top { display: flex; align-items: center; gap: 12px; }
    .ax-card-icon {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
    }
    .ax-card-icon img { width: 26px; height: 26px; object-fit: contain; }
    .ax-card-icon .material-symbols-outlined { font-size: 22px; color: var(--c-on-surface-variant); }
    .ax-card-name { font-weight: 700; font-size: 14px; color: var(--c-on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ax-card-sub { font-size: 12px; color: var(--c-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ax-card-bottom { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .ax-card-time { font-size: 11px; color: var(--c-on-surface-variant); font-family: 'JetBrains Mono', monospace; }
    .ax-dot { width: 9px; height: 9px; border-radius: 9999px; flex-shrink: 0; }
    .ax-dot.on { background: var(--health-backedup); box-shadow: 0 0 6px var(--health-backedup); }
    .ax-dot.off { background: var(--health-failed); box-shadow: 0 0 6px var(--health-failed); }
    .ax-dot.unknown { background: var(--health-unknown); }
    .ax-empty { padding: 40px; text-align: center; color: var(--c-on-surface-variant); }

    /* 빈 히어로 */
    .ax-hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 56px 24px; }
    .ax-hero .material-symbols-outlined { font-size: 56px; color: var(--c-primary); opacity: 0.5; }
  </style>
</head>
<body class="font-body-md">
  <!-- 페이지 본문: shell.js 가 이 .dsp-page 를 사이드바+헤더와 함께 main 안으로 이동시킨다 -->
  <div class="dsp-page">
    <div class="flex justify-between items-end mb-element-gap">
      <div>
        <h2 class="font-headline-lg text-headline-lg text-primary" style="margin:0;">자산 관리</h2>
        <p class="text-on-surface-variant" style="margin:4px 0 0;">왼쪽 트리 또는 아래 목록에서 자산을 선택하세요</p>
      </div>
    </div>

    <!-- KPI 행 -->
    <div class="dsp-grid mb-element-gap" style="grid-template-columns:repeat(5,1fr);">
      <a href="/assets" style="text-decoration:none;"><div class="kpi-card">
        <div class="kpi-icon kpi-icon-primary"><span class="material-symbols-outlined">dns</span></div>
        <div class="kpi-body"><span class="kpi-label">전체 자산</span>
          <div class="kpi-value-row"><span class="kpi-value" id="kpi-total">–</span><span class="kpi-unit">EA</span></div></div>
      </div></a>
      <a href="/history?tab=0&health=backedup" style="text-decoration:none;"><div class="kpi-card">
        <div class="kpi-icon kpi-icon-success"><span class="material-symbols-outlined">cloud_upload</span></div>
        <div class="kpi-body"><span class="kpi-label">백업 갱신</span>
          <div class="kpi-value-row"><span class="kpi-value" id="kpi-backed">–</span></div></div>
      </div></a>
      <a href="/history?tab=0&health=unchanged" style="text-decoration:none;"><div class="kpi-card">
        <div class="kpi-icon kpi-icon-info"><span class="material-symbols-outlined">remove_circle_outline</span></div>
        <div class="kpi-body"><span class="kpi-label">변경 없음</span>
          <div class="kpi-value-row"><span class="kpi-value" id="kpi-unchanged">–</span></div></div>
      </div></a>
      <a href="/history?tab=0&health=failed" style="text-decoration:none;"><div class="kpi-card">
        <div class="kpi-icon kpi-icon-error"><span class="material-symbols-outlined fill">warning</span></div>
        <div class="kpi-body"><span class="kpi-label">주의 필요</span>
          <div class="kpi-value-row"><span class="kpi-value" id="kpi-failed" style="color:var(--health-failed);">–</span></div></div>
      </div></a>
      <a href="/history?tab=2&pstatus=offline" style="text-decoration:none;"><div class="kpi-card">
        <div class="kpi-icon kpi-icon-error"><span class="material-symbols-outlined">wifi_off</span></div>
        <div class="kpi-body"><span class="kpi-label">오프라인</span>
          <div class="kpi-value-row"><span class="kpi-value" id="kpi-offline">–</span></div></div>
      </div></a>
    </div>

    <!-- 검색 가능 자산 목록 -->
    <div class="nm-card">
      <div class="ax-filter">
        <div class="nm-inset ax-search">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="ax-search" placeholder="자산명 / IP 검색" />
        </div>
        <div class="ax-divider"></div>
        <select class="ax-input" id="ax-type" style="width:150px;"><option value="">전체 타입</option></select>
        <select class="ax-input" id="ax-line" style="width:150px;"><option value="">전체 라인</option></select>
        <select class="ax-input" id="ax-health" style="width:150px;">
          <option value="">전체 상태</option>
          <option value="backedup">백업 갱신</option>
          <option value="unchanged">변경 없음</option>
          <option value="failed">작업 실패</option>
          <option value="inprogress">작업중</option>
          <option value="unknown">내역 없음</option>
        </select>
        <div class="ax-spacer"></div>
        <a class="kpi-card" href="/history?tab=0" style="padding:8px 14px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:700;color:var(--c-on-surface-variant);gap:6px;">
          <span class="material-symbols-outlined" style="font-size:18px;">table_chart</span>통합조회 / 편집
        </a>
      </div>
      <div class="ax-count" id="ax-count"></div>
      <div id="ax-list"></div>
    </div>
  </div>

  <script src="/app/shell.js"></script>
  <script src="/app/asset-explorer.js"></script>
</body>
</html>
