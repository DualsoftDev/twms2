<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자산 상세 — TWMS</title>
  <!-- 테마 선적용 (FOUC 방지) -->
  <script>(function(){try{var t=localStorage.getItem('twms-theme');if(t==='dark')document.documentElement.classList.add('dark');else if(t==='light')document.documentElement.classList.remove('dark');}catch(e){}})();</script>
  <!-- 폰트: Inter(라틴) + Noto Sans KR(한글) + Material Symbols -->
  <link rel="stylesheet" href="/lib/fonts/fonts.css" />
  <!-- Tailwind: 빌드타임 컴파일(twms.css) + 폰트 self-host(fonts.css). CDN 제거됨. -->
  <link rel="stylesheet" href="/app/twms.css" />
  <link rel="stylesheet" href="/app/theme.css" />
  <style>
    /* ── 자산 상세 페이지 전용 ── */
    .adt-header { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .adt-icon {
      width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
    }
    .adt-icon img { width: 38px; height: 38px; object-fit: contain; }
    .adt-icon .material-symbols-outlined { font-size: 32px; color: var(--c-primary); }
    .adt-title { font-weight: 800; font-size: 22px; color: var(--c-on-surface); }
    .adt-subtitle { font-size: 12px; color: var(--c-on-surface-variant); margin-top: 2px; }
    .adt-chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .chip .material-symbols-outlined { font-size: 14px; margin-right: 3px; }
    .chip-ghost { background: transparent; border: 1px solid var(--c-outline-variant); color: var(--c-on-surface-variant); }

    .adt-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .adt-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 12px; cursor: pointer;
      font-size: 13px; font-weight: 700; border: none; text-decoration: none;
      background: var(--c-surface); color: var(--c-on-surface-variant);
      box-shadow: 4px 4px 8px var(--nm-dark), -4px -4px 8px var(--nm-light);
      transition: all 0.15s ease;
    }
    .adt-btn:hover { color: var(--c-primary); }
    .adt-btn:active { box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light); }
    .adt-btn .material-symbols-outlined { font-size: 18px; }

    .adt-divider { height: 1px; background: var(--c-outline-variant); opacity: 0.5; margin: 16px 0; }
    .adt-section-title { font-weight: 700; font-size: 13px; color: var(--c-on-surface-variant); display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .adt-section-title .material-symbols-outlined { font-size: 18px; }

    /* 정보 필드 (인셋 라벨) */
    .adt-field { margin-bottom: 14px; }
    .adt-field-label { font-size: 11px; color: var(--c-on-surface-variant); margin-bottom: 4px; font-weight: 600; }
    .adt-field-value {
      background: var(--c-surface-container-low); color: var(--c-on-surface);
      border-radius: 10px; padding: 10px 12px; font-size: 14px; min-height: 20px;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
      white-space: pre-wrap; word-break: break-word;
    }
    .adt-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .adt-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── 편집 모드 (admin 로그인 시) — .adt-field-value 대신 인셋 입력 위젯 ── */
    .adt-input, .adt-textarea {
      width: 100%; background: var(--c-surface-container-low); color: var(--c-on-surface);
      border: none; outline: none; border-radius: 10px; padding: 10px 12px;
      font-size: 14px; font-family: inherit;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
    }
    .adt-input:focus, .adt-textarea:focus { box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light), 0 0 0 2px var(--c-primary); }
    .adt-input.invalid, .adt-input.invalid:focus { box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light), 0 0 0 2px var(--health-failed); }
    .adt-field-err { color: var(--health-failed); font-size: 12px; font-weight: 600; margin-top: 5px; }
    .adt-input::placeholder, .adt-textarea::placeholder { color: var(--c-outline); }
    .adt-input:disabled { opacity: 0.45; cursor: not-allowed; }
    select.adt-input { cursor: pointer; }
    .adt-textarea { min-height: 120px; resize: vertical; }
    .adt-check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--c-on-surface); user-select: none; }
    .adt-check input { width: 17px; height: 17px; accent-color: var(--c-primary); cursor: pointer; }
    .adt-btn-primary { color: var(--c-on-primary); background: var(--c-primary); }
    .adt-btn-primary:hover { color: var(--c-on-primary); }
    .adt-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    /* 드라이브 연결 정보 검사 결과 */
    .adt-check-result {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 10px 14px; border-radius: 12px; margin-top: 4px; font-size: 13px; font-weight: 600; line-height: 1.5;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
    }
    .adt-check-result .material-symbols-outlined { font-size: 20px; }
    .adt-check-result small { font-weight: 500; }
    .adt-check-result.ok { color: var(--health-backedup); }
    .adt-check-result.warn { color: var(--health-inprogress); }
    .adt-check-result.err { color: var(--health-failed); }
    .adt-check-result.info { color: var(--c-primary); }
    .adt-edit-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .adt-edit-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--c-primary); }
    .adt-edit-badge .material-symbols-outlined { font-size: 16px; }

    /* 매뉴얼 */
    .adt-manual-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
    .adt-manual-name { flex: 1; font-size: 13px; color: var(--c-on-surface); }
    .adt-manuals-all { margin-top: 10px; }
    .adt-manuals-all summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--c-on-surface-variant); display: flex; align-items: center; gap: 6px; list-style: none; padding: 8px 0; }
    .adt-manuals-all summary::-webkit-details-marker { display: none; }
    .adt-manuals-all summary .material-symbols-outlined { font-size: 18px; }

    /* 백업 이력 테이블 */
    .adt-table-wrap {
      border-radius: 16px; padding: 6px 12px; overflow-x: auto; margin-top: 4px;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
      background: var(--c-surface-container-low);
    }
    .adt-table-wrap .nm-table td, .adt-table-wrap .nm-table th { white-space: nowrap; }
    .adt-iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 8px; cursor: pointer; border: none;
      background: var(--c-surface); color: var(--c-on-surface-variant); text-decoration: none;
      box-shadow: 2px 2px 5px var(--nm-dark), -2px -2px 5px var(--nm-light);
      transition: all 0.15s ease;
    }
    .adt-iconbtn:hover { color: var(--c-primary); }
    .adt-iconbtn .material-symbols-outlined { font-size: 18px; }
    .adt-iconbtn:disabled { opacity: 0.35; cursor: not-allowed; }
    .adt-iconbtn:disabled:hover { color: var(--c-on-surface-variant); }

    /* 백업 이력 페이저 (history.html .hist-pager 와 동일 톤) */
    .adt-pager { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--c-on-surface-variant); }

    .adt-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .adt-empty { padding: 16px; color: var(--c-on-surface-variant); font-size: 13px; }
    .adt-loading { padding: 40px; text-align: center; color: var(--c-on-surface-variant); }

    /* ── 경유 자산 다이얼로그 (뉴모피즘) ── */
    .adt-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: none; align-items: center; justify-content: center; z-index: 200; padding: 24px;
    }
    .adt-modal-backdrop.show { display: flex; }
    .adt-modal {
      background: var(--c-surface); border-radius: 24px; padding: 24px;
      width: min(560px, 100%); max-height: 88vh; display: flex; flex-direction: column;
      box-shadow: 8px 8px 18px var(--nm-dark), -8px -8px 18px var(--nm-light);
    }
    .adt-modal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .adt-modal-title { font-weight: 800; font-size: 1.05rem; color: var(--c-on-surface); margin: 0; display: flex; align-items: center; gap: 8px; flex: 1; }
    .adt-modal-title .material-symbols-outlined { font-size: 22px; color: var(--c-primary); }
    .adt-modal-sub { font-size: 13px; color: var(--c-on-surface-variant); margin: 0 0 14px; }
    .adt-via-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 2px; }
    .adt-via-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px;
      background: var(--c-surface-container-low);
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
    }
    .adt-via-icon {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
    }
    .adt-via-icon img { width: 26px; height: 26px; object-fit: contain; }
    .adt-via-icon .material-symbols-outlined { font-size: 22px; color: var(--c-primary); }
    .adt-via-info { flex: 1; min-width: 0; }
    .adt-via-name { font-weight: 700; font-size: 14px; color: var(--c-on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .adt-via-meta { font-size: 12px; color: var(--c-on-surface-variant); margin-top: 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .adt-via-meta .adt-via-ip { font-family: var(--font-mono, monospace); }

    /* ── 백업 로그 다이얼로그 (history.html 로그 다이얼로그와 동일 톤) ── */
    .adt-modal--wide { width: min(860px, 100%); }
    #adt-log-sub { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #adt-log-sub .adt-btn { padding: 5px 10px; font-size: 12px; }
    .adt-log-body {
      overflow-y: auto; flex: 1 1 auto; border-radius: 12px; padding: 4px 8px;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
      background: var(--c-surface-container-low);
    }
    .adt-log-body .nm-table th { white-space: nowrap; }
    .adt-log-body .nm-table td { vertical-align: top; }

    @media (max-width: 860px) { .adt-grid2 { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { .adt-row2 { grid-template-columns: 1fr; } }
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
</head>
<body class="font-body-md">
  <!-- 페이지 본문: shell.js 가 이 .dsp-page 를 사이드바+헤더와 함께 main 안으로 이동시킨다 -->
  <div class="dsp-page">
    <div class="flex justify-between items-end mb-element-gap">
      <div>
        <h2 class="font-headline-lg text-headline-lg text-primary" style="margin:0;">자산 관리</h2>
        <p class="text-on-surface-variant" style="margin:4px 0 0;">자산 상세 정보 · 백업 이력</p>
      </div>
      <a class="adt-btn" href="/assets"><span class="material-symbols-outlined">arrow_back</span>목록</a>
    </div>

    <div class="nm-card" id="adt-root">
      <div class="adt-loading"><span class="material-symbols-outlined" style="font-size:40px;opacity:0.4;">hourglass_top</span><div>불러오는 중...</div></div>
    </div>
  </div>

  <!-- ─── 다이얼로그: 이 자산을 경유하는 자산 ─── -->
  <div class="adt-modal-backdrop" id="adt-via-modal">
    <div class="adt-modal">
      <div class="adt-modal-head">
        <h3 class="adt-modal-title"><span class="material-symbols-outlined">hub</span>이 자산을 경유하는 자산</h3>
        <button class="adt-iconbtn" data-close title="닫기"><span class="material-symbols-outlined">close</span></button>
      </div>
      <p class="adt-modal-sub" id="adt-via-sub"></p>
      <div class="adt-via-list" id="adt-via-list"></div>
    </div>
  </div>

  <!-- ─── 다이얼로그: 백업 로그 ─── -->
  <div class="adt-modal-backdrop" id="adt-log-modal">
    <div class="adt-modal adt-modal--wide">
      <div class="adt-modal-head">
        <h3 class="adt-modal-title"><span class="material-symbols-outlined">article</span><span id="adt-log-title">백업 로그</span></h3>
        <button class="adt-iconbtn" data-close title="닫기"><span class="material-symbols-outlined">close</span></button>
      </div>
      <p class="adt-modal-sub" id="adt-log-sub"></p>
      <div class="adt-log-body" id="adt-log-body"></div>
    </div>
  </div>

  <script src="/app/shell.js"></script>
  <script src="/app/asset-detail.js"></script>
</body>
</html>
