<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자산 상세 — TWMS</title>
  <!-- 테마 선적용 (FOUC 방지) -->
  <script>(function(){try{var t=localStorage.getItem('twms-theme');if(t==='dark')document.documentElement.classList.add('dark');else if(t==='light')document.documentElement.classList.remove('dark');}catch(e){}})();</script>
  <!-- 폰트: Pretendard(한글) + Hanken Grotesk + JetBrains Mono + Material Symbols -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <!-- ⚠ Tailwind Play CDN (개발/검증용). 운영 전 self-host 컴파일로 교체. -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/app/tailwind-config.js"></script>
  <link rel="stylesheet" href="/app/theme.css" />
  <style>
    /* ── 자산 상세 페이지 전용 ── */
    .ad-header { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .ad-icon {
      width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
    }
    .ad-icon img { width: 38px; height: 38px; object-fit: contain; }
    .ad-icon .material-symbols-outlined { font-size: 32px; color: var(--c-primary); }
    .ad-title { font-weight: 800; font-size: 22px; color: var(--c-on-surface); }
    .ad-subtitle { font-size: 12px; color: var(--c-on-surface-variant); margin-top: 2px; }
    .ad-chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .chip .material-symbols-outlined { font-size: 14px; margin-right: 3px; }
    .chip-ghost { background: transparent; border: 1px solid var(--c-outline-variant); color: var(--c-on-surface-variant); }

    .ad-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .ad-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 12px; cursor: pointer;
      font-size: 13px; font-weight: 700; border: none; text-decoration: none;
      background: var(--c-surface); color: var(--c-on-surface-variant);
      box-shadow: 4px 4px 8px var(--nm-dark), -4px -4px 8px var(--nm-light);
      transition: all 0.15s ease;
    }
    .ad-btn:hover { color: var(--c-primary); }
    .ad-btn:active { box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light); }
    .ad-btn .material-symbols-outlined { font-size: 18px; }

    .ad-divider { height: 1px; background: var(--c-outline-variant); opacity: 0.5; margin: 16px 0; }
    .ad-section-title { font-weight: 700; font-size: 13px; color: var(--c-on-surface-variant); display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .ad-section-title .material-symbols-outlined { font-size: 18px; }

    /* 정보 필드 (인셋 라벨) */
    .ad-field { margin-bottom: 14px; }
    .ad-field-label { font-size: 11px; color: var(--c-on-surface-variant); margin-bottom: 4px; font-weight: 600; }
    .ad-field-value {
      background: var(--c-surface-container-low); color: var(--c-on-surface);
      border-radius: 10px; padding: 10px 12px; font-size: 14px; min-height: 20px;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
      white-space: pre-wrap; word-break: break-word;
    }
    .ad-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .ad-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* 매뉴얼 */
    .ad-manual-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
    .ad-manual-name { flex: 1; font-size: 13px; color: var(--c-on-surface); }
    .ad-manuals-all { margin-top: 10px; }
    .ad-manuals-all summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--c-on-surface-variant); display: flex; align-items: center; gap: 6px; list-style: none; padding: 8px 0; }
    .ad-manuals-all summary::-webkit-details-marker { display: none; }
    .ad-manuals-all summary .material-symbols-outlined { font-size: 18px; }

    /* 백업 이력 테이블 */
    .ad-table-wrap {
      border-radius: 16px; padding: 6px 12px; overflow-x: auto; margin-top: 4px;
      box-shadow: inset 2px 2px 5px var(--nm-dark), inset -2px -2px 5px var(--nm-light);
      background: var(--c-surface-container-low);
    }
    .ad-table-wrap .nm-table td, .ad-table-wrap .nm-table th { white-space: nowrap; }
    .ad-iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 8px; cursor: pointer; border: none;
      background: var(--c-surface); color: var(--c-on-surface-variant); text-decoration: none;
      box-shadow: 2px 2px 5px var(--nm-dark), -2px -2px 5px var(--nm-light);
      transition: all 0.15s ease;
    }
    .ad-iconbtn:hover { color: var(--c-primary); }
    .ad-iconbtn .material-symbols-outlined { font-size: 18px; }

    .ad-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .ad-empty { padding: 16px; color: var(--c-on-surface-variant); font-size: 13px; }
    .ad-loading { padding: 40px; text-align: center; color: var(--c-on-surface-variant); }

    @media (max-width: 860px) { .ad-grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="font-body-md">
  <!-- 페이지 본문: shell.js 가 이 .dsp-page 를 사이드바+헤더와 함께 main 안으로 이동시킨다 -->
  <div class="dsp-page">
    <div class="flex justify-between items-end mb-element-gap">
      <div>
        <h2 class="font-headline-lg text-headline-lg text-primary" style="margin:0;">자산 관리</h2>
        <p class="text-on-surface-variant" style="margin:4px 0 0;">자산 상세 정보 · 백업 이력</p>
      </div>
      <a class="ad-btn" href="/assets"><span class="material-symbols-outlined">arrow_back</span>목록</a>
    </div>

    <div class="nm-card" id="ad-root">
      <div class="ad-loading"><span class="material-symbols-outlined" style="font-size:40px;opacity:0.4;">hourglass_top</span><div>불러오는 중...</div></div>
    </div>
  </div>

  <script src="/app/shell.js"></script>
  <script src="/app/asset-detail.js"></script>
</body>
</html>
